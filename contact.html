<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Jamie Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #F8F5F0;
    --cream-mid: #EDE8E0;
    --ink: #1C1915;
    --ink-soft: #3A3530;
    --ink-muted: #7A7268;
    --border: #D5CEC4;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Jost', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body {
    background-color: var(--cream);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.8;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  .site-header {
    border-bottom: 1px solid var(--border);
    padding: 22px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--cream);
    z-index: 100;
  }
  .site-nav { display: flex; gap: 40px; }
  .site-nav a {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .site-nav a:hover { color: var(--ink); }
  .site-nav a.active { color: var(--ink); font-weight: 500; }

  .page-wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 96px 48px 80px;
  }
  .page-kicker {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 28px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 500;
    line-height: 1.1;
    color: var(--ink);
    margin-bottom: 20px;
  }
  .contact-intro {
    font-size: 17px;
    color: var(--ink-muted);
    font-weight: 300;
    max-width: 480px;
    margin-bottom: 64px;
    line-height: 1.75;
  }
  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--border);
  }
  .contact-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0;
    border-bottom: 1px solid var(--border);
  }
  .contact-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .contact-value {
    font-size: 17px;
    font-weight: 300;
    color: var(--ink);
    text-decoration: none;
    letter-spacing: 0.01em;
    transition: color 0.2s ease;
  }
  .contact-value:hover { color: var(--ink-muted); }

  .site-footer {
    border-top: 1px solid var(--border);
    padding: 32px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 80px;
  }
  .site-footer p {
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: 400;
    margin: 0;
    letter-spacing: 0.04em;
  }
  @media (max-width: 680px) {
    .page-wrap { padding: 64px 24px; }
    .contact-item { flex-direction: column; align-items: flex-start; gap: 8px; }
    .site-header { padding: 16px 24px; }
    .site-footer { padding: 24px; flex-direction: column; gap: 8px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
  </nav>
  <nav class="site-nav">
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<div class="page-wrap">
  <div class="page-kicker">Contact</div>
  <h1>Get in touch.</h1>
  <p class="contact-intro">Questions or business inquiries — feel free to reach out.</p>

  <div class="contact-list">
    <div class="contact-item">
      <span class="contact-label">Email</span>
      <a href="mailto:jaehyeok7206@gmail.com" class="contact-value">jaehyeok7206@gmail.com</a>
    </div>
    <div class="contact-item">
      <span class="contact-label">Phone</span>
      <a href="tel:+14144397624" class="contact-value">414-439-7624</a>
    </div>
    <div class="contact-item">
      <span class="contact-label">Based in</span>
      <span class="contact-value">Fort Lee, NJ</span>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>Jamie Park · Fort Lee, NJ</p>
  <p>All opinions are my own.</p>
</footer>

</body>
</html>
